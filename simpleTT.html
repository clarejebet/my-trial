<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><P></P>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal TimeTable</title>
</head>
<body>
  <style>
    body{background-color: pink;}
    .h1{background-color: green;}
    .pt{text-align: center;}
    .m{background-color: purple;}
    .t{background-color: purple;}
    .w{background-color: purple;}
    .t{background-color: purple;}
    .f{background-color: purple;}
   .s{background-color: purple;}
    .S{background-color: purple;}
    .c{color: blue;}
  </style>
  <i class="c"><caption > CLARE'S PERSONAL TIMETABLE</caption></i> 
  <table border="4">
    <tr class="h1">
    <th scope="col">DAY</th>
     <th scope="col">MORNING</th>
      <th scope="col">DAYTIME</th>
       <th scope="col">EVENING</th>
      </tr>
  
      <tr>
        <th class="m" scope="row">MONDAY</th>
        <td>sleeping</td>
         <td>classes</td>
          <td>PT</td>
      </tr>

      <tr>
         <th class="t" scope="row">TUESDAY</th>
        <td>tutorials</td>
         <td>classes</td>
          <td>PT</td>
      </tr>

      <tr>
         <th class="w" scope="row">WEDNESDAY</th>
        <td>classes</td>
         <td>washing</td>
          <td>PT</td>
      </tr>

      <tr>
         <th class="t" scope="row">THURSDAY</th>
        <td>classes</td>
         <td>coding</td>
          <td>PT</td>
      </tr>

      <tr>
         <th class="f" scope="row">FRIDAY</th>
        <td>classes</td>
         <td>coding</td>
          <td>PT</td>
      </tr>

      <tr>
         <th class="s" scope="row">SATURDAY</th>
        <td>sleeping</td>
         <td>washing</td>
          <td>PT</td>
      </tr>

      <tr>
         <th  class="S" scope="row">SUNDAY</th>
        <td class="pt" colspan="3">PERSONAL TIME (PT)</td>
      </tr>
      <img src="file" alt="">

  </table>
  
</body>
</html>
